name: Daily lavender quote

on:
  schedule:
    # 00:17 in Asia/Seoul (UTC+9).
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lavender-quote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render today's quote
        run: python3 scripts/update_daily_quote.py
      - name: Save changed quote
        run: |
          git add assets/daily-quote.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh daily lavender quote"
          git push origin HEAD:main
